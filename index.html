<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Keeper</title>
  <meta name="theme-color" content="#1a73e8">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Contact Keeper</h1>
    <button id="installBtn" hidden>Install app</button>
  </header>
  <main>
    <p>Your contacts stay on this device. Nothing is uploaded anywhere.</p>
    <label class="upload">
      <input type="file" id="fileInput" accept=".vcf,text/vcard,text/x-vcard">
      Choose contacts file (.vcf)
    </label>
    <p id="status">No file loaded yet.</p>
    <div id="tools" hidden>
      <input type="search" id="search" placeholder="Search name, number, email, company">
      <div class="row">
        <select id="sort">
          <option value="az">Name A to Z</option>
          <option value="za">Name Z to A</option>
        </select>
        <select id="filter">
          <option value="all">All contacts</option>
          <option value="nobday">No birthday</option>
          <option value="nophone">No phone number</option>
          <option value="noname">No name</option>
          <option value="dupes">Possible duplicates</option>
        </select>
      </div>
      <p id="count"></p>
      <button id="clearBtn" class="link">Remove all contacts from this device</button>
    </div>
    <ul id="list"></ul>
  </main>
  <script src="vcard.js"></script>
  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
