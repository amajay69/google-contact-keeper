<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Keeper</title>
  <meta name="theme-color" content="#1a73e8">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Contact Keeper</h1>
    <button id="installBtn" hidden>Install app</button>
  </header>
  <main>
    <p>Your contacts stay on this device. Nothing is uploaded anywhere.</p>
    <label class="upload">
      <input type="file" id="fileInput" accept=".vcf,text/vcard,text/x-vcard">
      Choose contacts file (.vcf)
    </label>
    <p id="status">No file loaded yet.</p>
    <ul id="list"></ul>
  </main>
  <script src="vcard.js"></script>
  <script src="app.js"></script>
</body>
</html>
